<div class="notif-overlay" *ngIf="isOpen" (click)="closePanel.emit()"></div>
<div class="notif-panel" [class.open]="isOpen" (click)="$event.stopPropagation()">
  <div class="notif-header">
    <div class="notif-title">
      <span class="material-icons">notifications</span>
      <span>Notifications</span>
      <span class="notif-badge" *ngIf="unreadNotifs > 0">{{ unreadNotifs }}</span>
    </div>
    <div class="notif-actions">
      <button (click)="clearAll()">Clear All</button>
      <button (click)="markAllRead()">Mark All as read</button>
    </div>
  </div>

  <div class="notif-list">

    <!-- Loading state -->
    <div class="notif-empty" *ngIf="isLoading">
      <span class="material-icons">hourglass_empty</span>
      <p>Loading...</p>
    </div>

    <!-- Error state -->
    <div class="notif-empty" *ngIf="!isLoading && errorMsg">
      <span class="material-icons">error_outline</span>
      <p>{{ errorMsg }}</p>
    </div>

    <!-- Empty state -->
    <div class="notif-empty" *ngIf="!isLoading && !errorMsg && notifications.length === 0">
      <span class="material-icons">notifications_none</span>
      <p>No notifications</p>
    </div>

    <!-- Notification items -->
    <div class="notif-item"
         *ngFor="let n of notifications"
         [class.unread]="!n.read"
         (click)="markRead(n)">
      <div class="notif-dot" *ngIf="!n.read"></div>
      <div class="notif-icon-wrap" [class]="'type-' + n.type">
        <span class="material-icons">{{ n.icon }}</span>
      </div>
      <div class="notif-content">
        <p class="notif-msg">{{ n.message }}</p>
        <span class="notif-time">{{ n.time }}</span>
      </div>
    </div>

  </div>

  <div class="notif-footer">
    <button class="view-all-btn" routerLink="/app/alarms" (click)="closePanel.emit()">
      View All Alerts
      <span class="material-icons">arrow_forward</span>
    </button>
  </div>
</div>
