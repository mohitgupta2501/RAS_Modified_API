<div class="auth-wrapper">
  <div class="auth-left">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="auth-left-content">
      <div class="logo-box">
        <span class="material-icons">bar_chart</span>
      </div>
      <h1 class="auth-title">
        Roll Analytics<br />
        <span class="shimmer">System</span>
      </h1>
      <p class="auth-tagline">Intelligent Roll Management</p>
      <!-- <div class="stats-row">
        <div class="stat">
          <span class="stat-num">15</span>
          <span class="stat-label">Stands</span>
        </div>
        <div class="stat">
          <span class="stat-num">3</span>
          <span class="stat-label">Shifts</span>
        </div>
        <div class="stat">
          <span class="stat-num">24/7</span>
          <span class="stat-label">Monitor</span>
        </div>
      </div> -->
    </div>
    <div class="auth-footer">Powered by Hitachi India Pvt Ltd</div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="form-card" *ngIf="!otpSent">
        <a routerLink="/auth/login" class="back-link">
          <span class="material-icons">arrow_back</span>
          Back to Login
        </a>

        <div class="icon-circle">
          <span class="material-icons">lock_reset</span>
        </div>
        <h2 class="form-title center">Forgot Password</h2>
        <p class="form-subtitle center">Enter your email to receive OTP</p>

        <form (ngSubmit)="sendOtp()">
          <div class="auth-field">
            <label class="field-label">EMAIL ADDRESS</label>
            <div class="input-wrapper">
              <span class="material-icons field-icon">email</span>
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
              />
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            <span class="spinner" *ngIf="isLoading"></span>
            {{ isLoading ? 'Sending...' : 'Send OTP' }}
          </button>

          <div class="error-alert" *ngIf="errorMessage">
            <span class="material-icons">error</span>
            {{ errorMessage }}
          </div>
        </form>
      </div>

      <div class="success-card" *ngIf="otpSent">
        <span class="material-icons success-icon">check_circle</span>
        <h3 class="success-title">OTP Sent!</h3>
        <p class="success-text">We sent OTP to {{ email }}</p>
        <button type="button" class="submit-btn" (click)="goToVerify()">
          Continue to Verify
        </button>
      </div>
    </div>
  </div>
</div>
